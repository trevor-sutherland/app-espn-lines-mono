@if (auth.isLoggedIn()) {
  <nav class="navbar navbar-expand-lg navbar-dark locksonly-navbar">
    <div class="container-xl">
      <a class="navbar-brand locksonly-brand" routerLink="/home">
        <img
          src="/assets/locksonly-logo.png"
          alt="LocksOnly"
          class="locksonly-logo"
        />
      </a>

      <button
        class="navbar-toggler locksonly-toggler"
        type="button"
        aria-controls="locksOnlyNavbar"
        [attr.aria-expanded]="!navCollapsed"
        aria-label="Toggle navigation"
        (click)="toggleNav()"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div
        class="collapse navbar-collapse"
        [class.show]="!navCollapsed"
        id="locksOnlyNavbar"
      >
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 locksonly-main-nav">
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/home"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
            >
              Home
            </a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/pick"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
            >
              Picks
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/picks-summary" routerLinkActive="active">
              Weekly Summary
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/results" routerLinkActive="active">
              Results
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/account" routerLinkActive="active">
              Account
            </a>
          </li>
          @if (auth.isAdmin()) {
            <li class="nav-item">
              <a class="nav-link" routerLink="/admin/users" routerLinkActive="active">
                Users
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" routerLink="/admin/pot" routerLinkActive="active">
                Pot
              </a>
            </li>
          }
        </ul>

        <div class="locksonly-nav-actions">
          <label class="visually-hidden" for="sport-select">Select sport</label>
          <select
            id="sport-select"
            class="form-select locksonly-sport-select"
            [ngModel]="sportService.sportKey()"
            (ngModelChange)="sportService.setSportKey($event)"
          >
            @for (sport of sports(); track sport.key) {
              <option [value]="sport.key">{{ sport.label }}</option>
            }
          </select>

          @if (auth.isAdmin()) {
            <div class="locksonly-nav-admin">
              <button
                type="button"
                class="btn btn-locksonly-outline"
                (click)="onRefreshOdds()"
                [disabled]="refreshing"
              >
                @if (refreshing) {
                  <span class="spinner-border spinner-border-sm me-1" role="status"></span>
                }
                Refresh Odds
              </button>
              <button
                type="button"
                class="btn btn-locksonly-outline"
                (click)="onSyncResults()"
                [disabled]="syncingResults"
              >
                @if (syncingResults) {
                  <span class="spinner-border spinner-border-sm me-1" role="status"></span>
                }
                Sync Results
              </button>
            </div>
          }

          <span class="locksonly-user-email">
            {{ auth.session()?.email }}
          </span>
          <button type="button" class="btn btn-locksonly-outline" (click)="logout()">
            Log Out
          </button>
        </div>
      </div>
    </div>
  </nav>
}
