<main class="locksonly-page locksonly-auth">
<div class="locksonly-auth-card">
  <h2 class="mb-4 text-center">Set new password</h2>

  @if (!success) {
    <form (ngSubmit)="onSubmit($event)" #form="ngForm" autocomplete="off">
      @if (error) {
        <div class="alert alert-danger">{{ error }}</div>
      }

      <div class="mb-3">
        <label for="password" class="form-label">New password</label>
        <input
          type="password"
          class="form-control"
          id="password"
          name="password"
          required
          minlength="6"
          [(ngModel)]="password"
          [disabled]="loading"
          autocomplete="new-password"
        />
      </div>

      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Confirm new password</label>
        <input
          type="password"
          class="form-control"
          id="confirmPassword"
          name="confirmPassword"
          required
          [(ngModel)]="confirmPassword"
          [disabled]="loading"
          autocomplete="new-password"
        />
        @if (confirmPassword && password !== confirmPassword) {
          <div class="form-text text-danger">Passwords do not match.</div>
        }
      </div>

      <button
        type="submit"
        class="btn btn-locksonly-primary w-100"
        [disabled]="loading || form.invalid || !passwordsMatch"
      >
        @if (loading) {
          <span class="spinner-border spinner-border-sm me-2" role="status"></span>
        }
        Save new password
      </button>
    </form>
  } @else {
    <div class="alert alert-success text-center">
      Password updated. Redirecting to login…
    </div>
  }

  <div class="text-center mt-3">
    <a routerLink="/login" class="btn btn-link">Back to login</a>
  </div>
</div>
</main>
